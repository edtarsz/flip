<div class="relative w-full max-w-[500px] h-[700px]">

    <!-- 
    @if (true) {
    <div
        class="absolute inset-0 bg-(--color-wine-red) rounded-lg flex justify-between items-center px-10 w-full h-full">
    </div>
    } 
    -->

    <div #swipeCard class="relative w-full h-full">
        <div #innerCard
            class="relative w-full h-full swipe-card cursor-grab flex flex-col items-stretch bg-(--color-background-light) rounded-lg overflow-hidden">
            <div class="hero-bg flex-1" [style.background-image]="getCardImage()"></div>
            <div class="flex flex-col bg-(--color-background-light)">
                <div class="flex p-5 justify-between items-center">
                    <div class="flex flex-col gap-3">
                        <div class="flex flex-col">
                            <div class="flex gap-2">
                                <h4 class="text-lg font-bold select-none">
                                    {{ film.title }}
                                </h4>
                                <span class="flex items-center gap-1 text-md select-none">
                                    <svg lucideStar size="20" fill="#ffc300" color="#ffc300"></svg>
                                    <span class="font-bold">
                                        {{ film.vote_average | number:'1.0-1' }}
                                    </span>
                                </span>
                            </div>
                            <div class="flex items-center text-sm text-(--color-gray) gap-2">
                                <span>{{ film.release_date | date:'yyyy'}}</span>
                                <svg lucideCircle size="5" fill="#e2e8f0"></svg>
                                <p>97min</p>
                            </div>
                        </div>
                        <div class=" flex text-sm gap-2 select-none">
                            @for (genre of film.genre_ids.slice(0, 3); track $index) {
                            <span class="bg-(--color-wine-red) rounded-md px-2 py-1">{{ genres.find((g) => g.id
                                === genre)?.name }}</span>
                            }
                        </div>
                    </div>
                    <div
                        class="group cursor-pointer w-15 aspect-square rounded-full flex justify-center items-center bg-(--color-wine-red) self-center shrink-0 transition-colors duration-200 hover:bg-(--color-wine-dark)">
                        <svg lucideEye size="24"
                            class="text-white transition-colors duration-200 group-hover:text-(--color-text)/80"></svg>
                    </div>
                </div>
                <app-separator></app-separator>
                <div class="overflow-hidden px-5 py-3">
                    <p class="line-clamp-3 select-none text-lg text-(--color-gray)">{{ film.overview }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
