<div
  #viewport
  class="bg-dots z-0 relative top-[calc(32px+2vh)] sm:top-[calc(32px+5vh)] h-[calc(100dvh-32px-2vh)] sm:h-[calc(100vh-32px-5vh)] bg-(--color-background-light) overflow-hidden select-none"
  [class.cursor-grab]="!isDragging()"
  [class.cursor-grabbing]="isDragging()"
  (mousedown)="onMouseDown($event)"
  (wheel)="onWheel($event)"
>
  <div class="absolute inset-0 bg-dots -z-10 pointer-events-none">
    <div
      class="absolute inset-0 bg-linear-to-t from-(--color-background) via-(--color-background)/1 to-transparent"
    ></div>
    <div
      class="absolute inset-0 bg-linear-to-b from-(--color-background-light) via-(--color-background)/10 to-transparent"
    ></div>
  </div>

  <div
    class="absolute"
    style="width: 6000px; height: 4000px; top: 0; left: 0; transform-origin: 0 0"
    [style.transform]="
      'translate(' + translateX() + 'px,' + translateY() + 'px) scale(' + scale() + ')'
    "
  >
    <svg
      style="position: absolute; top: 0; left: 0; width: 6000px; height: 4000px"
      pointer-events="none"
      overflow="visible"
    >
      <line
        [attr.x1]="spineX1 + 6"
        [attr.y1]="SPINE_Y"
        [attr.x2]="spineX2 - 6"
        [attr.y2]="SPINE_Y"
        stroke="#989595"
        stroke-width="1"
        opacity="0.5"
      />

      <circle
        [attr.cx]="spineX1"
        [attr.cy]="SPINE_Y"
        r="5"
        fill="none"
        stroke="#989595"
        stroke-width="2"
        opacity="0.75"
      />

      <circle
        [attr.cx]="spineX2"
        [attr.cy]="SPINE_Y"
        r="5"
        fill="none"
        stroke="#989595"
        stroke-width="2"
        opacity="0.75"
      />

      @for (marker of yearMarkers; track marker.year) {
        <circle [attr.cx]="marker.cx" [attr.cy]="SPINE_Y" r="4" fill="#989595" opacity="1" />
        <text
          [attr.x]="marker.cx"
          [attr.y]="SPINE_Y + 22"
          text-anchor="middle"
          fill="#989595"
          opacity="0.55"
          font-size="12"
          font-family="Lato, sans-serif"
          font-weight="700"
          letter-spacing="1"
        >
          {{ marker.year }}
        </text>
      }
      @for (item of filmLayout; track item.film.id) {
        <path
          [attr.d]="item.branchPath"
          fill="none"
          stroke="#989595"
          stroke-width="1.5"
          stroke-dasharray="4 3"
          opacity="0.3"
        />
      }
    </svg>

    @for (item of filmLayout; track item.film.id) {
      <div
        class="absolute cursor-pointer transition-transform duration-200"
        [class.cursor-grabbing]="draggingFilm() === item"
        [class.transition-none]="draggingFilm() === item"
        [style.left.px]="item.x"
        [style.top.px]="item.y"
        [style.z-index]="draggingFilm() === item ? 50 : 10"
        (mousedown)="onFilmMouseDown($event, item)"
      >
        <app-film
          [film]="item.film"
          class="block w-[120px] h-[240px] transition-transform duration-200"
          [class.hover:scale-105]="!draggingFilm()"
        />
      </div>
    }
  </div>

  <div class="absolute top-6 right-6 flex gap-2 z-5">
    <button
      class="p-4 rounded-full bg-(--color-background) hover:bg-(--color-gray-dark) border border-(--color-gray-dark) text-(--color-text) text-sm font-semibold transition-colors shadow-lg cursor-pointer backdrop-blur-sm"
      (click)="resetViewport()"
    >
      <svg lucideHouse size="15"></svg>
    </button>
    <button
      class="p-4 rounded-full bg-(--color-background) hover:bg-(--color-gray-dark) border border-(--color-gray-dark) text-(--color-text) text-sm font-semibold transition-colors shadow-lg cursor-pointer backdrop-blur-sm"
      (click)="resetFilms()"
    >
      <svg lucideRotateCcw size="15"></svg>
    </button>
  </div>

  <div class="absolute bottom-6 right-6 flex flex-col gap-2 z-5">
    <button
      class="p-4 rounded-full bg-(--color-background) hover:bg-(--color-gray-dark) border border-(--color-gray-dark) text-(--color-text) text-sm font-semibold transition-colors shadow-lg cursor-pointer backdrop-blur-sm"
      (click)="zoom(1.2)"
    >
      <svg lucidePlus size="15"></svg>
    </button>
    <button
      class="p-4 rounded-full bg-(--color-background) hover:bg-(--color-gray-dark) border border-(--color-gray-dark) text-(--color-text) text-sm font-semibold transition-colors shadow-lg cursor-pointer backdrop-blur-sm"
      (click)="zoom(1 / 1.2)"
    >
      <svg lucideMinus size="15"></svg>
    </button>
  </div>
</div>
