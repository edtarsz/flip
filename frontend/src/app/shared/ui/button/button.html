<button
    [disabled]="disabled()"
    class="text-white text-sm sm:text-base flex items-center gap-1 justify-center font-bold transition-colors duration-200 px-3 h-full min-h-[38px] rounded bg-(--color-wine-red) hover:bg-(--color-wine-dark) disabled:opacity-50 disabled:cursor-not-allowed {{ size() }}"
>
    {{ label() }} @switch (icon()) { @case ('corner-down-left') {
    <svg lucideCornerDownLeft size="16"></svg>
    } @case ('search') {
    <svg lucideSearch size="16"></svg>
    } @case ('eye') {
    <svg lucideEye size="16"></svg>
    } }
</button>
