<div
  (click)="toggle()"
  class="flex relative rounded-full bg-(--color-gray-dark) border border-(--color-gray)/20 gap-1 h-full p-0.5 cursor-pointer"
>
  <span
    class="absolute top-0.5 bottom-0.5 left-0.5 aspect-square rounded-full bg-(--color-wine-red) pointer-events-none transition-transform duration-200 ease-in-out"
    [ngClass]="{'translate-x-[calc(100%+0.25rem)]': currentTheme() === 'dark'}"
  ></span>

  <button
    class="relative rounded-md aspect-square flex justify-center items-center p-1 transition-colors duration-200"
  >
    <svg
      lucideSun
      size="16"
      class="transition-colors duration-200"
      [class.text-(--color-background)]="currentTheme() === 'light'"
    >
    </svg>
  </button>

  <button
    class="relative rounded-md aspect-square flex justify-center items-center p-1 transition-colors duration-200"
  >
    <svg
      lucideMoon
      size="16"
      class="transition-colors duration-200"
      [class.text-white]="currentTheme() === 'dark'"
    >
    </svg>
  </button>
</div>
