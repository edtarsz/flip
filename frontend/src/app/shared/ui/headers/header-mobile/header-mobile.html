<header class="bg-(--color-background) relative">
    <app-separator></app-separator>
    <ul class="grid grid-cols-2">
        <li
            (click)="navToSwipe()"
            class="flex justify-center border-r border-(--color-gray)/20 py-4 w-full"
        >
            <div
                class="flex flex-col justify-center items-center gap-1 text-sm"
            >
                <svg lucideGalleryHorizontalEnd size="20"></svg>
                <a routerLink="/swipe">Swipe</a>
            </div>
        </li>
        <li
            (click)="navToWatchlist()"
            class="flex justify-center"
        >
            <div
                class="flex flex-col justify-center items-center gap-1 text-sm w-full"
            >
                <svg lucideThumbsUp size="20"></svg>
                <a routerLink="/watchlist">Watchlists</a>
            </div>
        </li>
    </ul>
</header>
