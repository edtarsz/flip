<header class="bg-(--color-background) relative z-2">
  <app-separator></app-separator>
  <ul class="grid grid-cols-4">
    <li
      routerLink="/films"
      class="flex justify-center border-r border-(--color-gray)/20 pt-4 pb-7 w-full cursor-pointer"
    >
      <div
        routerLinkActive="text-(--color-wine-red)"
        class="flex flex-col justify-center items-center gap-1 text-xs w-full pointer-events-none"
      >
        <svg lucideClapperboard size="20"></svg>
        <span>Movies</span>
      </div>
    </li>
    <li
      routerLink="/swipe"
      class="flex justify-center border-r border-(--color-gray)/20 pt-4 pb-7 w-full cursor-pointer"
    >
      <div
        routerLinkActive="text-(--color-wine-red)"
        class="flex flex-col justify-center items-center gap-1 text-xs w-full pointer-events-none"
      >
        <svg lucideGalleryHorizontalEnd size="20"></svg>
        <span>Swipe</span>
      </div>
    </li>
    <li
      routerLink="/watchlist"
      class="flex justify-center border-r border-(--color-gray)/20 pt-4 pb-7 w-full cursor-pointer"
    >
      <div
        routerLinkActive="text-(--color-wine-red)"
        class="flex flex-col justify-center items-center gap-1 text-xs w-full pointer-events-none"
      >
        <svg lucideThumbsUp size="20"></svg>
        <span>Watchlist</span>
      </div>
    </li>
    <li routerLink="/trees" class="flex justify-center pt-4 pb-7 w-full cursor-pointer">
      <div
        routerLinkActive="text-(--color-wine-red)"
        class="flex flex-col justify-center items-center gap-1 text-xs w-full pointer-events-none"
      >
        <svg lucideNetwork size="20"></svg>
        <span>Trees</span>
      </div>
    </li>
  </ul>
</header>
