<app-separator
  class="fixed top-12 left-0 w-full z-7 block sm:hidden"
></app-separator>
<div
  class="top-12 fixed w-screen h-[calc(100dvh-3rem)] bg-(--color-background)/80 z-6 px-2 py-2 backdrop-blur-sm sm:hidden flex flex-col justify-between"
  (click)="onClose()"
>
  <div
    class="flex flex-col items-end w-full"
    (click)="$event.stopPropagation()"
  >
    <ul
      class="flex flex-col justify-center font-bold items-end w-full"
    >
      @if (isAuthenticated()) {
      <!-- <li
        class="p-2 w-full flex justify-end gap-2 items-center text-sm cursor-pointer"
        routerLink="/index"
        routerLinkActive
        #indexActive="routerLinkActive"
      >
        <hr
          class="h-px border-0 bg-(--color-wine-red)/40"
          [class.w-full]="indexActive.isActive"
        >
        <span [class.text-(--color-wine-red)]="indexActive.isActive">
          Home
        </span>
        <svg
          lucideHouse
          size="16"
          class="shrink-0"
          [ngClass]="{'text-(--color-wine-red)': indexActive.isActive}"
        >
        </svg>
      </li> -->
      <div class="justify-between items-center flex w-full">
        <div
          class="flex justify-end w-fit"
          (click)="$event.stopPropagation()"
        >
          <app-theme-toggle
            (toggleTheme)="onToggleTheme()"
            class="px-2"
          ></app-theme-toggle>
        </div>
        <li
          class="px-2 py-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
          routerLink="/swipe"
          routerLinkActive="text-(--color-wine-red)"
        >
          <span>Swipe</span>
          <svg
            lucideGalleryHorizontalEnd
            size="16"
            class="shrink-0"
          >
          </svg>
        </li>
      </div>
      <li
        class="px-2 py-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
        routerLink="/films"
        routerLinkActive="text-(--color-wine-red)"
      >
        <span>Films</span>
        <svg
          lucideClapperboard
          size="16"
          class="shrink-0"
        >
        </svg>
      </li>
      <li
        class="px-2 py-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
        routerLink="/watchlist"
        routerLinkActive="text-(--color-wine-red)"
      >
        <span>Watchlist</span>
        <svg
          lucideThumbsUp
          size="16"
          class="shrink-0"
        >
        </svg>
      </li>
      <li
        class="px-2 py-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
        routerLink="/trees"
        routerLinkActive="text-(--color-wine-red)"
      >
        <span>Trees</span>
        <svg
          lucideNetwork
          size="16"
          class="shrink-0"
        >
        </svg>
      </li>
      <app-separator
        class="w-full my-2 border-(--color-wine-red)/20"
      ></app-separator>

      <li
        class="px-2 py-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer text-(--color-text) hover:text-(--color-wine-red) transition-colors duration-200"
        (click)="onSignOut()"
      >
        <span>Log out</span>
      </li>

      } @else {
      <li
        class="px-2 py-4 w-full flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
        routerLink="/films"
        routerLinkActive="text-(--color-wine-red)"
      >
        <span>Films</span>
      </li>
      }
    </ul>
  </div>
</div>
