<app-separator class="fixed top-[calc(32px+2vh)] left-0 w-full z-7 block sm:hidden"></app-separator>
<div
  class="top-[calc(32px+2vh)] fixed w-screen h-[calc(100dvh-32px-2vh)] bg-(--color-background)/80 z-6 backdrop-blur-sm sm:hidden flex flex-col justify-between"
  (click)="onClose()"
>
  <div class="flex flex-col items-end w-full" (click)="$event.stopPropagation()">
    <ul
      class="flex flex-col justify-center font-bold items-end w-full text-[clamp(0.8rem,1vw,1rem)]"
    >
      @if (isAuthenticated()) {
        <div class="justify-between items-center flex w-full">
          <div class="flex justify-end w-fit" (click)="$event.stopPropagation()">
            <app-theme-toggle (toggleTheme)="onToggleTheme()" class="px-2"></app-theme-toggle>
          </div>

          <li
            class="p-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
            routerLink="/settings"
            routerLinkActive="text-(--color-wine-red)"
          >
            <span>Settings</span>
            <svg lucideSettings size="16" class="shrink-0"></svg>
          </li>
        </div>

        <app-separator class="w-full border-(--color-wine-red)/20"></app-separator>

        <li
          class="p-4 w-1/2 flex justify-end gap-2 items-center cursor-pointer text-(--color-text) hover:text-(--color-wine-red) transition-colors duration-200"
          (click)="onSignOut()"
        >
          <span>Log out</span>
        </li>
      } @else {
        <li
          class="px-2 py-4 w-full flex justify-end gap-2 items-center cursor-pointer hover:text-(--color-wine-red) transition-colors duration-200"
          routerLink="/films"
          routerLinkActive="text-(--color-wine-red)"
        >
          <span>Films</span>
        </li>
      }
    </ul>
  </div>
</div>
