<div #scrollWrapper class="overflow-y-auto h-full pr-0 sm:pr-2 custom-scrollbar" data-lenis-prevent>
  <!-- <div #scrollWrapper class="overflow-y-auto h-full no-scrollbar" data-lenis-prevent> -->
  <div class="sm:flex flex-wrap grid grid-cols-3 sm:justify-start justify-center sm:gap-3 gap-2">
    @if (films().length === 0 && loading()) {
      @for (item of [1, 2, 3, 4]; track $index) {
        <app-film [loading]="true"></app-film>
      }
    }
    @for (film of films(); track film.id; let idx = $index) {
      <app-film
        [film]="film"
        [isPriority]="idx < 6"
        [hideFilmDetails]="hideFilmDetails()"
        (click)="onFilmClick(film)"
        class="grow basis-[80px] sm:basis-[180px] sm:max-w-[250px]"
      ></app-film>
    }
    @if (hasMore()) {
      <div
        #sentinel
        id="vertical-infinite-sentinel"
        class="col-span-full w-full h-10 flex justify-center items-center"
      >
        @if (loading()) {
          <app-film [loading]="true"></app-film>
        }
      </div>
    }
  </div>
</div>
