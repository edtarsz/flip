<div
  class="flex flex-col relative z-0 top-[calc(32px+2vh)] sm:top-[calc(32px+5vh)] sm:h-[calc(100vh-32px-5vh)] overflow-hidden"
  [ngClass]="isAuthenticated() ? 'h-[calc(100dvh-32px-2vh-4.5rem)]' : 'h-[calc(100dvh-32px-2vh)]'"
>
  <!-- <div class="absolute inset-0 bg-dots -z-10 pointer-events-none">
    <div
      class="absolute inset-0 bg-linear-to-t from-(--color-background-light) via-(--color-background)/1 to-transparent"
    ></div>
    <div
      class="absolute inset-0 bg-linear-to-b from-(--color-background-light) via-(--color-background)/10 to-transparent"
    ></div>
  </div> -->

  <div class="grid grid-cols-[auto_1fr] flex-1 min-h-0 overflow-hidden">
    <app-film-filters
      #filters
      [genres]="genres()"
      [selectedGenres]="selectedGenres()"
      [selectedYear]="selectedYear()"
      (apply)="applyFilters($event)"
      class="h-full"
    >
    </app-film-filters>

    <app-floating-filter-button
      [hasActiveFilters]="hasActiveFilters()"
      [isVisibleSidebar]="filters.isVisibleSidebar"
      (toggleSidebar)="filters.onToggleSidebar()"
    ></app-floating-filter-button>

    <div class="flex flex-col overflow-hidden min-h-0">
      <section class="flex flex-col gap-2 sm:gap-[1.5vh] p-2 sm:p-[1.5vh] h-full overflow-hidden">
        <div class="flex justify-between items-center">
          <div class="flex gap-4 items-center h-full w-full">
            <app-film-search-bar
              class="w-full"
              [searchModel]="searchModel()"
              (searchModelChange)="searchModel.set($event)"
              (searchSubmitted)="onSearchSubmitted($event)"
              (searchReset)="onReset()"
              (toggleFilters)="filters.onToggleSidebar()"
              [hasActiveFilters]="selectedGenres().length > 0 || selectedYear() !== null"
            >
            </app-film-search-bar>
          </div>
        </div>

        <app-film-grid
          [films]="films()"
          [loading]="loadingNextPage()"
          [hasMore]="hasMorePages()"
          (nearEnd)="loadNextPage()"
          class="flex-1 min-h-0"
        >
        </app-film-grid>
      </section>
    </div>
  </div>
</div>
