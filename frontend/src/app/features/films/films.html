<app-separator class="relative top-25"></app-separator>
<div class="grid grid-cols-[20vw_1fr] relative top-25 min-h-[calc(100vh-6.5rem)] overflow-hidden">
    <app-film-filters [genres]="genres()" [selectedGenres]="selectedGenres()" [selectedYear]="selectedYear()"
        (apply)="applyFilters($event)">
    </app-film-filters>

    <section class="flex flex-col gap-4 p-5 overflow-auto">
        <div class="flex justify-between items-center">
            <div class="flex gap-4 items-center h-full">
                <app-film-search-bar [searchModel]="searchModel()" (searchModelChange)="searchModel.set($event)"
                    (searchSubmitted)="onSearchSubmitted($event)" (searchReset)="onReset()">
                </app-film-search-bar>
            </div>
            <div class="relative">
                <button class="text-(--color-gray)/80" (click)="onSeeAll()">{{ rosalia }}</button>
            </div>
        </div>

        @if (showAll()) {
        <app-film-grid [films]="films()" [loading]="loadingNextPage()" [hasMore]="hasMorePages()"
            (nearEnd)="loadNextPage()">
        </app-film-grid>
        } @else {
        <app-film-carousel title="Recently Popular" [films]="films()" [loading]="loadingNextPage()"
            [hasMore]="hasMorePages()" (nearEnd)="loadNextPage()">
        </app-film-carousel>

        <app-film-carousel title="Top Rated" [films]="films()" [loading]="loadingNextPage()" [hasMore]="hasMorePages()"
            (nearEnd)="loadNextPage()">
        </app-film-carousel>
        }
    </section>
</div>
