<form class="flex items-center gap-2 h-full" [formRoot]="searchForm">
    <div
        class="opacity-100 w-[74px] flex justify-center items-center transition-opacity duration-200 relative md:hidden cursor-pointer"
        (click)="toggleFilters.emit()"
    >
        <svg
            lucideChevronsUpDown
            size="32"
            class="rotate-90"
        >
        </svg>
        @if (hasActiveFilters()) {
        <span
            class="absolute top-0 right-0 bg-(--color-wine-red) w-[8px] flex items-center justify-center rounded-full aspect-square text-xs"
        ></span>
        }
    </div>
    <div
        class="flex rounded-sm gap-2 w-full min-w-0 lg:max-w-[500px] border border-(--color-gray)/20 bg-(--color-background) items-center px-3 py-2"
    >
        <svg lucideSearch size="16" color="var(--color-gray)" class="shrink-0">
        </svg>
        <input
            type="search"
            class="text-sm outline-none flex-1 min-w-0 bg-transparent"
            [formField]="searchForm.query"
            placeholder="Search by name"
        >
        @if (internalSearch().query && internalSearch().query.length > 0) {
        <button
            type="reset"
            class="cursor-pointer shrink-0"
            (click)="onReset()"
        >
            <svg lucideX size="16" color="var(--color-gray)"></svg>
        </button>
        }
    </div>
    <div class="flex gap-2">
        <app-button
            label="Search"
            icon="corner-down-left"
            class="h-full"
        ></app-button>
        <button
            type="button"
            (click)="onReset()"
            class="bg-(--color-background) border border-(--color-gray)/20 rounded-sm text-(--color-gray) cursor-pointer transition-colors duration-200 font-bold text-sm px-3 hover:text-(--color-text)/80 hover:border-(--color-gray)/50"
        >
            Clear
        </button>
    </div>
</form>
