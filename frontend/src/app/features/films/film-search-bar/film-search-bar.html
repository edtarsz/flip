<form class="flex items-center gap-2 h-full" [formRoot]="searchForm">
    <div class="flex rounded-sm gap-2 min-w-[400px] border border-(--color-gray)/20 items-center px-3 py-2">
        <svg lucideSearch size="16" color="var(--color-gray)"></svg>
        <input type="search" class="text-sm outline-none flex-1 bg-transparent" [formField]="searchForm.query"
            placeholder="Search by name">
        @if (internalSearch().query && internalSearch().query.length > 0) {
        <button type="reset" class="cursor-pointer" (click)="onReset()">
            <svg lucideX size="16" color="var(--color-gray)"></svg>
        </button>
        }
    </div>
    <app-button type="submit" label="Search" icon="corner-down-left" class="h-full"></app-button>
</form>
