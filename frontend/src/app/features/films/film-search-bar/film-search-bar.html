<form class="flex items-stretch gap-2 w-full" [formRoot]="searchForm">
  <div
    class="flex rounded-sm gap-2 w-full min-w-0 lg:max-w-[500px] border border-(--color-gray-dark) bg-(--color-background) items-center px-3 py-2"
  >
    <svg lucideSearch size="16" color="var(--color-gray)" class="shrink-0"></svg>
    <input
      type="search"
      class="text-[clamp(0.7rem,0.9vw,1rem)] outline-none flex-1 min-w-0 bg-transparent"
      [formField]="searchForm.query"
      placeholder="Search by name"
    />
    @if (internalSearch().query && internalSearch().query.length > 0) {
      <button type="reset" class="cursor-pointer shrink-0" (click)="onReset()">
        <svg lucideX size="16" color="var(--color-gray)"></svg>
      </button>
    }
  </div>
  <div class="flex items-stretch gap-2">
    <app-button label="Search" icon="corner-down-left"></app-button>
    <button
      type="button"
      (click)="onReset()"
      class="bg-(--color-background) border border-(--color-gray-dark) rounded-sm text-(--color-gray) cursor-pointer transition-colors duration-200 font-bold text-[clamp(0.7rem,0.9vw,1rem)] px-3 hover:text-(--color-text)/80 hover:border-(--color-border-hover)"
    >
      Clear
    </button>
  </div>
</form>
