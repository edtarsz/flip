<h4 class="w-fit font-bold text-xl pb-4">{{ title }}</h4>

<div #carouselContainer class="perspective-distant flex gap-4 overflow-x-scroll no-scrollbar drag-scroll">
    @for (film of films; track film.id) {
    <app-film [film]="film" class="film-card w-[175px]"></app-film>
    }

    @if (hasMore && loading) {
    <app-film [loading]="true" class="film-card w-[175px]"></app-film>
    }
</div>
