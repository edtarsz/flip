<div
    class="flex flex-col relative top-20 h-[calc(100vh-5rem)] overflow-hidden"
>
    <div
        #scrollWrapper
        class="overflow-y-auto h-full custom-scrollbar overscroll-contain pr-2 px-5 my-4 mr-4"
        data-lenis-prevent
    >
        <div
            class="grid md:grid-cols-[repeat(auto-fill,minmax(180px,1fr))] grid-cols-2 sm:grid-cols-3 sm:gap-x-5 sm:gap-y-6 gap-x-2 gap-y-2 pb-5"
        >
            @for (item of watchlist(); track item.id; let idx = $index) {
            <app-film
                [film]="item.film"
                [isPriority]="idx < 6"
                class="film-card w-full"
                (click)="onFilmClick(item.film.external_film_id)"
            ></app-film>
            } @empty {
            <p>to do, there are not movies</p>
            }
        </div>
    </div>
</div>
