<div class="w-full h-screen relative z-0">
    <div
        class="absolute inset-0 bg-(--color-background-light) bg-dots -z-10 pointer-events-none"
    >
        <div
            class="absolute inset-0 bg-linear-to-t from-(--color-background-light) via-(--color-background-light)/1 to-transparent"
        >
        </div>
        <div
            class="absolute inset-0 bg-linear-to-b from-(--color-background-light) via-(--color-background-light)/10 to-transparent"
        >
        </div>
    </div>

    <div
        class="flex flex-col gap-10 justify-center items-center h-screen relative p-5"
    >
        <div
            class="flex flex-col gap-4 w-full p-[5vw] md:w-[500px] border border-(--color-gray)/20 md:p-10 rounded-md bg-(--color-background) relative"
        >
            <div class="flex flex-col items-center justify-center">
                <img src="/assets/svgs/logo.svg" alt="logo" class="w-20">
                <h3 class="text-3xl font-bold">
                    {{ title }}
                </h3>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
